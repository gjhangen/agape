[package]
name = "agape-server"
version = "0.1.0"
edition = "2024"

[dependencies]
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls", "dkim"] }
agape-kernel = { version = "0.1.0", path = "../agape-kernel" }
argon2 = "0.5"
axum = "0.8"
futures-util = "0.3.34"
rand = "0.9"
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
hickory-resolver = "0.25"
mail-parser = "0.11"
rsa = { version = "0.9", features = ["pem"] }
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
