name: Semio Pass 14 Rust parity

on:
  push:
    branches:
      - semio-rust-parity-pass14
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone isolated evidence branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch semio-rust-parity-pass14 https://github.com/gjhangen/agape.git evidence

      - name: Verify available Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version --verbose

      - name: Decode fixtures, compile, and execute parity gate
        shell: bash
        run: |
          set -euo pipefail
          cd evidence
          base64 --decode semio-pass14-fixtures.tar.xz.b64 > semio-pass14-fixtures.tar.xz
          tar -xJf semio-pass14-fixtures.tar.xz
          test "$(find fixtures/candidate -name '*.json' | wc -l)" -eq 64
          chmod +x semio-pass14-rust/run_gate.sh
          ./semio-pass14-rust/run_gate.sh
          cat reports/rust_independent_reload_report.json
