.share-link { display: grid; gap: 8px; padding: 14px; border-radius: var(--r-md); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); margin-top: 12px; }
.share-link input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; font: inherit; background: var(--surface); color: var(--ink); }

/* ---------- review round: design ---------- */
/* sheets: a solid footer down to the safe area, a grabber, and a real entrance */
.sheet { padding-bottom: 0; }
.sheet-actions { margin: 0 -16px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -1px 0 var(--line), 0 -10px 16px -6px color-mix(in srgb, var(--surface) 90%, transparent); }
.sheet > .build > :last-child:not(.sheet-actions) { margin-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet::before { content: ""; justify-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: -6px 0 2px; }
/* sticky bars are opaque, with a hairline */
.finder { background: var(--surface); position: relative; z-index: 3; }
/* studio and tables never push the page sideways */
.sf-table { display: block; overflow-x: auto; max-width: 100%; }
.team-eds { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
.setup, .role.setup { min-width: 0; overflow-x: clip; }
.team-ed-head { grid-template-columns: auto minmax(0, 1fr); }
.roster-ed summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--r-pill); border: 1px solid var(--line); }
.roster-ed summary::-webkit-details-marker { display: none; }
.roster-ed summary::after { content: "▾"; font-size: 11px; color: var(--muted); }
.roster-ed[open] summary::after { content: "▴"; }
.sf-table input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
/* tiles keep their numbers on one line whether or not they have a note */
.tile { display: grid; grid-template-rows: auto auto 1fr; align-content: start; }
.tile small:empty { display: none; }
/* numbers in one family: the body face with tabular figures */
:root { --mono: var(--body); }
.num, .signal time, .route-steps li time, .clock b, .es-clock, .bs-clock, .l-clock, .lock { font-variant-numeric: tabular-nums; }
/* dark segments: the chosen one sits up, not in */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button.on { background: color-mix(in srgb, var(--ink) 14%, var(--surface)); } }
:root[data-theme="dark"] .seg button.on { background: color-mix(in srgb, var(--ink) 14%, var(--surface)); }
/* quieter links on names */
.signal .link-inline, .chat .link-inline.who { text-decoration-color: transparent; }
.signal .link-inline:hover, .chat .link-inline.who:hover { text-decoration-color: currentColor; }
/* no wireframe dashes */
.world-pane, .badge-tile { border-style: solid !important; }

/* ---------- review round: reach, contrast, consistency ---------- */
:root { --muted: #626977; }
.seat-sec.b3, .lg.b3 { fill: #C2410C; background: #C2410C; }
/* toasts at the top, clear of the tab bar, the cart and sheet buttons */
.toasts { top: calc(12px + env(safe-area-inset-top, 0px)); bottom: auto !important; }
.toast { box-shadow: 0 10px 30px rgb(0 0 0 / .25); }
/* fingers, not cursors: 44px targets */
.seg button { min-height: 40px; }
.sheet .seg button, .tips .seg button { min-height: 44px; }
.stepper button, .qty .btn, .cart-line .qty .btn { min-width: 40px; min-height: 40px; }
.sec-chip { min-height: 46px; }
.chips button, .cats button { min-height: 40px; }
.welcome-x { min-width: 44px; min-height: 44px; }
.link-inline { padding-block: 8px; }
.check { min-height: 44px; }
/* nothing smaller than 11px */
.mc-top, .mc-foot { font-size: 11px !important; }
.mcard.sm .mc-top, .mcard.sm .mc-foot { font-size: 10.5px !important; }
.team-logo { width: 22px; height: 22px; }
.team-logo.big { width: 30px; height: 30px; }
.pilot-note, .welcome-pilot { display: block; color: var(--muted); font-size: 12px; margin-top: 6px; }
.welcome-pilot { color: rgb(255 255 255 / .8); margin: 0; }
/* the live board mirrors: away score sits right */
.bs-team.away { text-align: right; justify-items: end; }
.l-sim-tag { margin-left: 8px; padding: 3px 7px; border-radius: var(--r-pill); background: rgb(255 255 255 / .12); color: var(--board-ink); font-size: 10.5px; letter-spacing: .08em; }
.l-sim-link { border-color: var(--line); color: var(--ink-2); }
.spot-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
.spot-row label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
.spot-row input { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); min-width: 0; text-transform: uppercase; }
.info-back { position: fixed; inset: 0; z-index: 70; background: rgb(10 12 16 / .5); display: grid; place-items: center; padding: 16px; }
.info { width: min(560px, 100%); max-height: 88dvh; overflow: auto; background: var(--surface); color: var(--ink); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 8px; text-align: left; }
.info h3 { font: 700 15px/1.2 var(--body); margin-top: 8px; }
.info p { color: var(--ink-2); line-height: 1.5; }
.ops-foot { margin-top: 16px; max-width: 560px; }
.tour .btn:not(.primary) { background: transparent; color: var(--board-ink); border: 1px solid color-mix(in srgb, var(--board-ink) 35%, transparent); }
.talk label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
.talk label small { color: var(--muted); font-weight: 500; }
.talk input, .talk textarea { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; font: inherit; font-size: 16px; background: var(--bg); color: var(--ink); }
.talk-roles { display: flex; flex-wrap: wrap; gap: 6px; }
.talk-roles .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.l-sim-acts { display: flex; flex-wrap: wrap; gap: 10px; }
.l-sim-acts .btn { text-decoration: none; text-align: center; flex: 1 1 200px; }
.btn.ghost-board { background: transparent; color: var(--board-ink); border: 1px solid color-mix(in srgb, var(--board-ink) 35%, transparent); }
.l-sim-acts { display: flex; flex-wrap: wrap; gap: 10px; }
.l-sim-acts .btn { text-decoration: none; text-align: center; flex: 1 1 200px; }
.btn.ghost-board { background: transparent; color: var(--board-ink); border: 1px solid color-mix(in srgb, var(--board-ink) 35%, transparent); }
/* the search tucks away while you scroll down and comes back when you scroll up */
.finder { max-height: 80px; transition: max-height .2s ease, padding .2s ease, opacity .15s ease; overflow: hidden; }
.phone.tucked .finder { max-height: 0; padding-block: 0; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .finder { transition: none; } }
/* small phones */
@media (max-width: 360px) { .l-tag { display: none; } .l-score { grid-template-columns: auto auto 1fr auto auto; } .l-team { font-size: 12px; } }
.l-top { flex-wrap: nowrap; }
/* tablets: the app fills the screen, readable width */
@media (min-width: 601px) and (max-width: 1100px) {
  .app-shell { display: block; padding: 0; background: var(--bg); }
  .app-shell .phone { width: 100%; max-width: none; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
  .app-shell .scope-body > * { max-width: 760px; margin-inline: auto; }
}
/* desktop: the phone, and a word beside it */
.desk-side { display: none; }
@media (min-width: 1101px) {
  .app-shell { grid-template-columns: 410px minmax(0, 360px); justify-content: center; gap: 48px; }
  .desk-side { display: grid; gap: 14px; align-content: center; }
  .desk-side .l-mark { font-size: 40px; }
  .desk-side p { color: var(--ink-2); line-height: 1.5; }
  .desk-side a { text-decoration: none; text-align: center; }
}
/* simulator on small screens: names only, no hints */
@media (max-width: 760px) { .harness.sim .persp button small { display: none; } .harness.sim .controls .h-btn:not(.primary):not(:first-child) { padding-inline: 10px; } }
/* long words never push the screen sideways */
.scope-body, .chat li, .chat span, .signal .grow, .page, .sheet { overflow-wrap: anywhere; min-width: 0; }
.chat li > span { min-width: 0; }
.live-dot { flex: none; }
@media (max-width: 360px) {
  .tips .seg button { padding-inline: 4px; font-size: 13px; }
  .cart-line { grid-template-columns: 1fr auto auto; }
  .cart-line > .art { display: none; }
  .sheet .seg button { font-size: 13px; padding-inline: 6px; }
}

/* Optional: built, not in the launch set */
.opt { display: inline-block; vertical-align: middle; margin-left: 6px; padding: 1px 7px; border-radius: 99px; font: 600 10.5px/1.6 var(--body); letter-spacing: .02em; font-style: normal;
  text-transform: none; color: var(--ink-2); border: 1px dashed color-mix(in srgb, var(--ink-2) 55%, transparent); background: transparent; white-space: nowrap; }
.opt.launch { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
h2 .opt, h3 .opt { position: relative; top: -1px; }
.fineprint { font-size: 12.5px; color: var(--muted); margin: 10px 0; line-height: 1.45; }
.pay-mode { margin: 4px 0 8px; }
.pay-explain { font-size: 13px; color: var(--muted); margin: 6px 0 10px; line-height: 1.45; }
.trip-split { display: block; color: var(--muted); font-size: 12.5px; margin: -2px 0 6px; }
.setup .block-head .btn.sm { margin-left: 6px; }
.moment-hero .opt { color: rgba(255,255,255,.85); border-color: rgba(255,255,255,.5); }

/* ---------- Level navigation: icons, words for the first week ---------- */
.space-bar.icons { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); }
.space-bar.icons button { display: grid; justify-items: center; gap: 3px; padding: 10px 4px 12px; font: 600 11px/1 var(--body); letter-spacing: .01em; text-transform: none; }
.space-bar.icons button.on { box-shadow: inset 0 2.5px 0 var(--accent); }
.space-bar.icons small { font-size: 10.5px; }
.space-bar.icons .badge { top: 5px; right: calc(50% - 22px); }
.me-av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, currentColor 14%, transparent); border: 1.6px solid currentColor; font: 700 13px/1 var(--body); }
.me-av.big { width: 52px; height: 52px; font-size: 22px; color: var(--accent); flex: none; }

/* ---------- The event, folded into Get ---------- */
.anchor { display: grid; width: 100%; border: 0; background: var(--board); color: var(--board-ink); padding: 0; text-align: left; cursor: pointer; }
.an-score { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px 6px; font: 800 18px/1 var(--display); letter-spacing: .05em; }
.an-feed { display: flex; align-items: center; gap: 8px; padding: 0 12px 10px 16px; font-size: 13.5px; color: color-mix(in srgb, var(--board-ink) 88%, transparent); animation: feed-in .5s ease-out both; }
.an-feed b { color: var(--board-ink); }
.an-feed svg { opacity: .7; flex: none; }
.an-dot { width: 7px; height: 7px; border-radius: 50%; background: #FF4D6D; flex: none; animation: live-dot 1.6s ease-in-out infinite; }
@keyframes live-dot { 50% { opacity: .35; } }
@keyframes feed-in { from { opacity: 0; transform: translateY(4px); } }
.anchor .pts { font-weight: 800; }

/* ---------- Pages that open over the app ---------- */
.overlay-page { position: absolute; inset: 0; z-index: 25; background: var(--bg); display: flex; flex-direction: column; animation: page-in .22s ease-out both; }
@keyframes page-in { from { transform: translateX(24px); opacity: 0; } }
.op-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px; background: var(--surface); border-bottom: 1px solid var(--line); font: 700 16px/1.2 var(--body); }
.op-head b { flex: 1; text-align: center; }
.op-back { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--ink); border-radius: 50%; }
.op-sp { width: 44px; }
.op-body { flex: 1; overflow-y: auto; display: grid; align-content: start; padding-bottom: 32px; }
.live-page .op-head { background: var(--board); color: var(--board-ink); border-color: transparent; }
.live-page .op-back { color: var(--board-ink); }

/* ---------- Deals, Play, People ---------- */
.points-head { display: grid; gap: 4px; }
.pts-big { font: 800 44px/1 var(--display); color: var(--accent); }
.seat-ticket { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px dashed var(--line); border-radius: var(--r-md); background: var(--surface); margin-bottom: 10px; }
.seat-ticket svg { color: var(--accent); flex: none; }
.seat-ticket small, .set-row small, .set-toggle small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.link-row { display: flex; align-items: center; gap: 8px; margin: 4px 16px 16px; padding: 14px 4px; border: 0; border-top: 1px solid var(--line); background: none; font-weight: 600; color: var(--ink); text-align: left; }
.explain { color: var(--ink-2); font-size: 14px; line-height: 1.45; margin: 0 0 10px; }
.battle-block .battle { margin-top: 0; }

/* ---------- Me ---------- */
.me-head { display: flex; align-items: center; gap: 14px; padding: 18px 16px 6px; }
.me-head h2 { font: 800 24px/1.1 var(--display); text-transform: var(--case, uppercase); }
.me-head small { color: var(--muted); }
.settings-list h2 { margin-bottom: 6px; }
.set-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); text-align: left; min-height: 52px; }
.set-row:last-child { border-bottom: 0; }
.set-row > svg:first-child { color: var(--accent); flex: none; }
.set-row b { font-weight: 600; }
.set-body { padding: 16px; gap: 12px; }
.set-body form { display: grid; gap: 12px; }
.set-toggle { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-toggle b { font-weight: 600; }
.set-toggle input[type=checkbox] { appearance: none; width: 46px; height: 28px; border-radius: 99px; background: var(--sunk); border: 1px solid var(--line); position: relative; flex: none; transition: background .15s; }
.set-toggle input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3); transition: transform .15s; }
.set-toggle input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
.set-toggle input[type=checkbox]:checked::after { transform: translateX(18px); }
.set-toggle.radio input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.set-group { display: grid; gap: 8px; padding: 6px 0 12px; border-bottom: 1px solid var(--line); }
.faq { border-bottom: 1px solid var(--line); padding: 12px 0; }
.faq summary { font-weight: 600; cursor: pointer; }
.faq p { margin: 8px 0 0; color: var(--ink-2); font-size: 14px; }
.about-mark { display: grid; justify-items: center; padding: 18px 0 6px; }
.about-mark b { font: 800 40px/1 var(--display); color: var(--accent); letter-spacing: .02em; }
.about-mark small { color: var(--muted); }
.btn.danger { color: var(--bad, #B42318); }
.center { text-align: center; }
.welcome-cta { background: #fff; color: var(--accent); font-weight: 800; border: 0; border-radius: var(--r-md); padding: 13px 14px; margin-top: 4px; }
.welcome-pts { color: rgb(255 255 255 / .8); }
html[data-text=large] .phone { font-size: 108%; }
html[data-text=larger] .phone { font-size: 118%; }
html.calm *, html.calm *::before, html.calm *::after { animation: none !important; transition: none !important; }

/* ---------- Opening Agape (onboarding, inside the phone) ---------- */
.ob { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 56px 24px 32px; background: var(--surface); color: var(--ink); overflow-y: auto; animation: ob-in .45s ease-out both; }
@keyframes ob-in { from { opacity: 0; transform: translateY(10px); } }
.ob h2 { font: 800 28px/1.05 var(--display); text-transform: var(--case, uppercase); margin: 0 0 10px; }
.ob-boot { background: var(--accent); align-items: center; justify-content: center; padding: 0; animation: none; }
.ob-mark b { font: 800 56px/1 var(--display); color: #fff; letter-spacing: .02em; animation: mark-in 1.4s ease-out both; display: block; }
@keyframes mark-in { 0% { opacity: 0; transform: scale(.9); } 40% { opacity: 1; transform: scale(1); } 100% { opacity: 1; } }
.ob-welcome { background: linear-gradient(170deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000)); color: #fff; justify-content: space-between; }
.ob-hero { display: grid; gap: 14px; margin-top: 40px; }
.ob-logo { font: 800 30px/1 var(--display); letter-spacing: .02em; }
.ob-hero h1 { font: 800 44px/1 var(--display); text-transform: var(--case, uppercase); margin: 0; color: #fff; }
.ob-hero p { color: rgb(255 255 255 / .9); font-size: 16px; line-height: 1.45; margin: 0; }
.ob-acts { display: grid; gap: 14px; justify-items: center; margin-top: auto; padding-top: 24px; }
.ob-welcome .link-inline { color: #fff; }
.btn.ob-primary { width: 100%; padding: 15px; font-size: 16px; font-weight: 800; border-radius: var(--r-md); border: 0; background: var(--accent); color: var(--accent-ink); }
.ob-welcome .btn.ob-primary { background: #fff; color: var(--accent); }
.btn.ob-primary:disabled { opacity: .45; }
.ob-form { gap: 12px; }
.ob-form .btn.ob-primary { margin-top: 8px; }
.btn.ob-social { width: 100%; padding: 13px; border-radius: var(--r-md); background: #000; color: #fff; border: 0; font-weight: 700; }
.btn.ob-social.light { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.ob-or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.ob-or::before, .ob-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.ob-fine, .ob-sub { color: var(--muted); font-size: 13px; margin: 0; }
.ob-warn { color: var(--bad, #B42318); font-size: 13px; }
.ob-perms { gap: 16px; }
.ob-perm { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: var(--r-md); background: var(--sunk); }
.ob-perm b { display: block; margin-bottom: 3px; }
.ob-perm small { color: var(--ink-2); font-size: 14px; }
.ob-pi { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; font-size: 20px; }
.ob-venue { justify-content: center; gap: 10px; }
.ob-venue h2 { font-size: 40px; }
.ob-event { padding: 16px; border-radius: var(--r-md); border: 1px solid var(--line); display: grid; gap: 6px; }
.ob-teams { display: flex; align-items: center; gap: 8px; font-weight: 700; flex-wrap: wrap; }
.ob-teams i { width: 12px; height: 12px; border-radius: 50%; }
.ob-teams span { color: var(--muted); font-weight: 500; }
.ob-event small { color: var(--muted); }
.ob-venue .ob-acts { margin-top: 24px; }
.btn.ob-scan { width: 100%; padding: 22px; border-radius: var(--r-md); border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 800; }
.btn.ob-scan.on { animation: live-dot 1s ease-in-out infinite; }
.sf-grid.three { grid-template-columns: repeat(3, 1fr); }

/* ---------- The demo shell around the phone ---------- */
.story { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: #0E0F13; color: #F1F2F5; }
.st-top { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #0B0C10; border-bottom: 1px solid rgb(255 255 255 / .08); flex-wrap: wrap; position: relative; z-index: 3; }
.st-brand { display: flex; align-items: baseline; gap: 8px; color: #fff; text-decoration: none; }
.st-brand b { font: 800 24px/1 var(--display); color: #FF5C8A; letter-spacing: .02em; }
.st-brand span { font-size: 13px; color: rgb(255 255 255 / .6); text-transform: uppercase; letter-spacing: .12em; }
.st-levels { display: flex; gap: 4px; padding: 3px; background: rgb(255 255 255 / .06); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.st-levels button { display: flex; align-items: center; gap: 7px; padding: 7px 11px; border: 0; border-radius: 9px; background: none; color: rgb(255 255 255 / .65); white-space: nowrap; font-size: 13px; }
.st-levels button b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .1); font-size: 11.5px; }
.st-levels button.on { background: #fff; color: #111; }
.st-levels button.on b { background: #B8174F; color: #fff; }
.st-ctl { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.story .h-btn, .story .h-seg button { background: rgb(255 255 255 / .08); color: #fff; border: 1px solid rgb(255 255 255 / .12); }
.story .h-seg button.on { background: #fff; color: #111; }
.st-stage { flex: 1; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(280px, 380px) minmax(0, .6fr); gap: 40px; align-items: center; padding: 24px; overflow: hidden; }
.st-venue { position: absolute; inset: 0; pointer-events: none; }
.st-glow { position: absolute; inset: -20%; background: radial-gradient(ellipse at 40% 55%, color-mix(in srgb, var(--venue, #B8174F) 45%, transparent), transparent 60%), radial-gradient(ellipse at 80% 10%, rgb(255 255 255 / .06), transparent 50%); }
.st-glow.roar { animation: roar 2.2s ease-out both; }
@keyframes roar { 0% { opacity: .6; } 15% { opacity: 1; filter: brightness(1.8) saturate(1.3); transform: scale(1.04); } 100% { opacity: 1; } }
.st-board { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 22px; align-items: center; padding: 8px 18px; border-radius: 99px; background: rgb(0 0 0 / .45); border: 1px solid rgb(255 255 255 / .1); font: 800 17px/1 var(--display); letter-spacing: .06em; color: #fff; }

/* ---------- The front door ---------- */
.site { --site-ink: #14161B; background: var(--bg); color: var(--ink); min-height: 100vh; }

.site-mark { display: flex; align-items: baseline; gap: 8px; }
.site-mark b { font: 800 28px/1 var(--display); color: var(--accent); letter-spacing: .02em; }
.site-mark span { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }

.site-acts { display: flex; gap: 10px; flex-wrap: wrap; }

.site-sec h2 { font: 800 clamp(30px, 4.5vw, 46px)/1 var(--display); text-transform: uppercase; margin: 0; }
.site-steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.site-steps li { counter-increment: s; display: grid; gap: 6px; padding: 20px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }

.site-why-demo { max-width: 720px; margin: 0; font-size: 17px; }
.site-seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.site-seat { display: grid; gap: 8px; align-content: start; padding: 18px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; transition: transform .15s, box-shadow .15s; }
.site-seat:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgb(0 0 0 / .08); }
.site-seat.ready { border-color: var(--accent); background: linear-gradient(160deg, var(--accent-soft), var(--surface)); }

@media (max-width: 1100px) {

.ob-mark small { display: block; text-align: center; color: rgb(255 255 255 / .8); font: 600 14px/1 var(--body); letter-spacing: .3em; text-transform: uppercase; margin-top: 8px; }

/* ---------- Agape Crew ---------- */
.crew-app .scope-body { padding-bottom: 20px; }
.cw-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.cw-online { display: flex; align-items: center; gap: 8px; border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 800; background: var(--sunk); color: var(--muted); }

.cw-hero { display: grid; gap: 10px; padding: 28px 18px; text-align: center; justify-items: center; }

@keyframes radar { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 100% { box-shadow: 0 0 0 36px transparent; } }
.cw-offer { margin: 14px; padding: 18px; border-radius: var(--r-lg); background: var(--board); color: var(--board-ink); display: grid; gap: 8px; box-shadow: 0 14px 40px rgb(0 0 0 / .25); animation: ob-in .3s ease both; }

.cw-steps { margin: 14px; display: grid; gap: 10px; }
.cw-step { display: flex; gap: 12px; padding: 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); opacity: .6; }

.cw-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 120px; align-items: end; }

@media (max-width: 760px) { .site-cta { padding: 24px; } .site-acts .btn.big { flex: 1 1 100%; justify-content: center; text-align: center; } .site-top nav .btn.sm:not(.primary) { display: none; } }

/* a clear status bar under the notch: nothing scrolls up against it */

.story:not(.tablet):not(.laptop):not(.full) .device-screen .overlay-page { padding-top: 56px; }
@media (max-width: 760px) {

  .story:not(.tablet):not(.laptop):not(.full) .device-screen .overlay-page { padding-top: 44px; }
}
.order-pill .pill-txt { display: grid; min-width: 0; text-align: left; line-height: 1.2; }

.order-pill .pill-txt small { font-size: 12.5px; opacity: .85; font-weight: 500; }
.free-hint { display: block; margin-top: 6px; color: var(--good); font-weight: 700; font-size: 13px; }
/* who are you: one page per audience */
.who-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.who-card { position: relative; display: grid; gap: 2px; padding: 16px 40px 16px 16px; border-radius: var(--r-lg); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; }
.who-card b { font-size: 16px; } .who-card span { color: var(--ink-2); font-size: 13.5px; }
.who-card i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-style: normal; font-weight: 800; color: var(--accent); font-size: 20px; }

.site-hero.solo { grid-template-columns: 1fr; }

.story.full .device-frame { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; height: 100dvh !important; padding: 0 !important; border-radius: 0 !important; aspect-ratio: auto !important; zoom: 1 !important; box-shadow: none !important; }

@media (min-width: 761px) { .story.full:not(.tablet):not(.laptop) .device-frame { width: min(100vw, 480px) !important; inset: 0 auto 0 50% !important; transform: translateX(-50%); box-shadow: 0 0 0 100vmax #0E0F13 !important; } }
.talk-form .btn.big, .talk-done .btn.big { font-family: var(--body); text-transform: none; letter-spacing: 0; font-weight: 800; }

/* phones: roles, levels and game/concert each get their own row, so nothing is hidden off the side */
@media (max-width: 760px) {

  .st-strip > .st-seats, .st-strip > .st-levels:not(.st-event) { flex: 1 1 100% !important; width: 100% !important; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
  .st-strip > *::-webkit-scrollbar { display: none; }

}
/* tablet widths: the device sits below the scoreboard, not on it */
@media (min-width: 761px) and (max-width: 1100px) { .story.tablet .st-device, .story.laptop .st-device { margin-top: 56px; } }
.st-moment { z-index: 3; }

@media (min-width: 600px) and (max-width: 980px) { .site-why { grid-template-columns: repeat(2, 1fr); } .site-levels { grid-template-columns: repeat(2, 1fr); } }

/* a solid danger button is white on red; a ghost one is red on clear */

.btn.ghost.danger { background: transparent !important; color: var(--bad, #C42B1C) !important; border: 1px solid color-mix(in srgb, var(--bad, #C42B1C) 45%, transparent) !important; }
/* while the story holds, its new step breathes: read me */
@keyframes held-breathe { 0%, 100% { box-shadow: inset 3px 0 0 color-mix(in srgb, #FF8BAA 30%, transparent); } 50% { box-shadow: inset 3px 0 0 #FF8BAA; } }
.st-story h2 { padding-left: 12px; margin-left: -12px; }

/* Phones: the demo phone is a real phone's screen (390 × 844) scaled to the width, so the app inside lays
   out exactly as it would on a phone: no words broken mid-way, nothing squeezed */
@media (max-width: 760px) {
  .story:not(.tablet):not(.laptop):not(.full) .device-frame { width: 414px !important; height: 868px !important; zoom: var(--mz, 1); padding: 12px !important; border-radius: 54px !important; aspect-ratio: auto !important; margin: 0 auto; box-sizing: border-box; }

  .story:not(.tablet):not(.laptop):not(.full) .device-screen > .phone, .story:not(.tablet):not(.laptop):not(.full) .device-screen .overlay-page { padding-top: 56px !important; }
  .story:not(.tablet):not(.laptop):not(.full) .device-screen .ob { padding: 56px 24px 24px !important; }
  .story:not(.tablet):not(.laptop):not(.full) .toasts.in-phone { bottom: 90px !important; }
}
/* controls inside an app keep the app's colors, not the dark demo frame's */
.story .device-screen .h-btn, .story .device-screen .h-seg button { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.story .device-screen .h-seg { background: var(--sunk); border-color: var(--line); }

.cw-bars i { display: block; width: 70%; min-height: 3px; }

.around-row .btn.perk:disabled { opacity: 1; background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line); }

.sx-open.danger { background: #C6352B; color: #fff; }

.site-mark svg.wordmark { height: 46px; color: var(--accent); --wm-tag: var(--ink); margin-left: -4px; }
.sx-logo { display: flex; justify-content: center; }

/* ---- Brand finalists (dark-first, electric pink). Not final: switch between them in Looks. ---- */
:root[data-palette="agape"], :root[data-palette="agape"][data-theme="light"], :root[data-palette="agape"][data-theme="dark"] {
  --bg: #0B0B0D; --surface: #151518; --sunk: #1D1D22; --ink: #F5F5F7; --ink-2: #C9C9D1; --muted: #8F8F9A; --line: #2A2A31;
  --accent: #FF2D95; --accent-ink: #FFFFFF; --board: #000000; --board-2: #111114; --board-dim: #8F8F9A;
  --map-floor: #2A2A31; --map-ground: #151518; --map-sec: #2E2E36; --map-conc: #111114; --map-line: #2A2A31;

:root[data-type="agape-barlow"] { --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Inter", system-ui, sans-serif; --case: none; --display-weight: 800; --display-track: 0; }
:root[data-type="agape-barlow-instrument"] { --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Instrument Sans", system-ui, sans-serif; --case: none; --display-weight: 800; --display-track: 0; }
:root[data-type="agape-bricolage"] { --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "Bricolage Grotesque", system-ui, sans-serif; --case: none; --display-weight: 800; --display-track: -.03em; }
:root[data-type="agape-instrument"] { --display: "Instrument Sans", system-ui, sans-serif; --body: "Instrument Sans", system-ui, sans-serif; --case: none; --display-weight: 700; --display-track: -.03em; }

/* ---------- Welcome: a glimpse of the app itself, not an empty gradient ---------- */
.ob-show { position: relative; margin: 48px 0 8px; min-height: 196px; }

.ob-card.back { position: absolute; z-index: 0; left: 14px; right: 14px; top: -34px; padding: 9px 16px 40px; background: rgb(255 255 255 / .2); color: #fff; box-shadow: none; backdrop-filter: blur(6px); animation: none; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.ob-card small { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #6B6E78; font-weight: 700; }
.ob-card > b { font: 800 22px/1.1 var(--display); text-transform: var(--case, uppercase); }
.ob-card > span { font-size: 14px; color: #4A4D57; }

.ob-card li { flex: 1; font-size: 10.5px; font-weight: 700; color: #9A9DA6; padding-top: 8px; border-top: 3px solid #E6E7EB; }
.ob-card li.done { color: #15161A; border-color: var(--accent); }
.ob-card li.now { color: var(--accent); border-image: linear-gradient(90deg, var(--accent) 50%, #E6E7EB 50%) 1; }
.ob-card .pay { font-size: 30px; } .ob-card .pay em { font: 600 13px var(--body, inherit); font-style: normal; color: #6B6E78; text-transform: none; }
.ob-take { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 10px; }

.ob-take i:first-child { background: var(--accent); color: var(--accent-ink); }
@keyframes ob-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .ob-card { animation: none; } }
.ob-card.back > b { font-size: 15px; white-space: nowrap; } .ob-card.back > span { color: rgb(255 255 255 / .8); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Front page: the product shown, not described ---------- */
.hm-kicker { font: 700 12.5px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.hm-hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 40px; align-items: center; padding: 64px max(20px, calc(50% - 560px)) 72px; background: radial-gradient(ellipse at 78% 40%, color-mix(in srgb, var(--accent) 55%, #2A0A16) 0%, #1A0910 45%, #0E0B0D 100%); color: #fff; }
.hm-hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 120px; background: linear-gradient(transparent, rgb(0 0 0 / .25)); pointer-events: none; }
.hm-copy { position: relative; z-index: 1; display: grid; gap: 22px; }
.hm-copy .hm-kicker { color: #FF8BAA; }

.hm-copy .lede { font-size: clamp(17px, 1.7vw, 20px); line-height: 1.55; color: rgb(255 255 255 / .8); max-width: 560px; margin: 0; }
.hm-copy .hero-note { color: rgb(255 255 255 / .78); } .hm-copy .hero-note a { color: #fff; font-weight: 700; }
.hm .hm-copy .btn.primary { background: #fff; color: #B8174F; border-color: #fff; }

.hm-phone.back { transform: translateX(-82%) translateY(46px) rotate(-6deg) scale(.88); opacity: .7; filter: saturate(.9); }
.hm-art .glance { position: absolute; left: -12px; bottom: 6px; width: 262px; padding: 18px; gap: 12px; max-width: none; z-index: 2; color: var(--ink); box-shadow: 0 30px 70px rgb(0 0 0 / .45); }

.iv2-market { border-top: 0; }

/* ---------- Where Agape goes: five steps, each keeping everything before it ---------- */
.gr .sec-head { display: grid; gap: 10px; justify-items: start; margin-bottom: 30px; }
.gr-cols { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; align-items: end; }
.gr-cols > li { display: grid; gap: 10px; align-content: end; }
.gr-when { display: grid; gap: 2px; font: 800 20px/1 var(--display); text-transform: uppercase; color: var(--ink); }
.gr-when small { font: 700 10.5px/1 var(--body); letter-spacing: .12em; color: var(--muted); }
.gr-cols > li:last-child .gr-when { color: var(--accent); }
.gr-stack { display: flex; flex-direction: column-reverse; gap: 6px; padding: 10px; border-radius: 16px 16px 6px 6px; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 16%, var(--line)); }
.gr-chip { display: block; padding: 11px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 700; line-height: 1.2;
  background: color-mix(in srgb, var(--accent) calc(18% + var(--j) * 14%), var(--surface)); color: var(--ink); }
.gr-chip.new { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 30%, transparent); }
.gr-cols > li.now .gr-stack { background: var(--accent); border-color: var(--accent); } .gr-cols > li.now .gr-chip.new { background: #fff; color: #B8174F; box-shadow: none; }
.gr-name { display: grid; gap: 4px; min-height: 104px; align-content: start; }
.gr-name em { font: 700 11px/1 var(--body); font-style: normal; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.gr-name b { font: 800 22px/1 var(--display); text-transform: uppercase; }
.gr-name small { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.gr-name a { font-weight: 700; color: var(--accent); text-decoration: none; font-size: 14px; }

/* ---------- Venues: the whole night on one screen ---------- */
.vn-console { background: #120A0E; color: #fff; }
.vn-console-in { max-width: 1120px; margin: 0 auto; padding: 64px 20px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 48px; align-items: center; }
.vn-console figure { margin: 0; padding: 8px; border-radius: 18px; background: #1E1F25; box-shadow: 0 30px 80px rgb(0 0 0 / .5); }
.vn-console img { display: block; width: 100%; border-radius: 11px; }
.vn-callouts { display: grid; gap: 14px; } .vn-callouts .hm-kicker { color: #FF8BAA; }
.vn-callouts h2 { margin: 0; color: #fff; font: 800 clamp(34px, 4.2vw, 54px)/.95 var(--display); text-transform: uppercase; }
.vn-callouts ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.vn-callouts li { display: grid; gap: 2px; padding: 14px 16px; border-radius: 14px; background: rgb(255 255 255 / .06); border-left: 3px solid #FF5C8A; }
.vn-callouts li b { font-size: 17px; } .vn-callouts li span { color: rgb(255 255 255 / .75); font-size: 15px; }

@media (max-width: 960px) {
  .gr-cols { grid-template-columns: 1fr; gap: 16px; }
  .gr-cols > li { grid-template-columns: 1fr; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
  .gr-cols > li.now { border-color: var(--accent); }
  .gr-when { order: -1; font-size: 18px; }
  .gr-stack { flex-direction: row; flex-wrap: wrap; padding: 8px; border-radius: 12px; }
  .gr-chip { padding: 8px 10px; font-size: 12.5px; }
  .gr-name { min-height: 0; }
  .vn-console-in { grid-template-columns: 1fr; padding: 48px 20px; gap: 28px; }
}
/* footers: tidy on every width */
.site-foot { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.site-foot nav { display: flex; flex-wrap: wrap; gap: 8px 16px; }
@media (max-width: 760px) { .site-foot { flex-direction: column; align-items: flex-start; gap: 14px; } .site-foot nav { gap: 10px 18px; } }

/* ---------- For investors: each step's leverage, and how much more flows through Agape ---------- */
.ld .sec-head { display: grid; gap: 10px; justify-items: start; margin-bottom: 26px; }
.ld-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: s; }
.ld-rows > li { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr); gap: 28px; align-items: center; padding: 18px 0; border-top: 1px solid var(--line); position: relative; }
.ld-rows > li + li::before { content: "↓ makes possible"; position: absolute; top: -10px; left: 0; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--accent); font-size: 11.5px; font-weight: 800; letter-spacing: .02em; }
.ld-step { display: grid; gap: 4px; }
.ld-step em { font: 700 11px/1 var(--body); font-style: normal; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.ld-step b { font: 800 26px/1 var(--display); text-transform: uppercase; }
.ld-step small { color: var(--ink-2); font-size: 15px; line-height: 1.45; }
.ld-flow { display: grid; gap: 6px; }
.ld-when { font: 700 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ld-label { font-size: 17px; font-weight: 800; color: var(--ink); }
.ld-bar { width: var(--w); height: 18px; border-radius: 999px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 65%, #fff), var(--accent)); box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 22%, transparent); }
.ld-rows > li:last-child .ld-bar { height: 28px; background: linear-gradient(90deg, var(--accent), #5E0A2A); } .ld-rows > li:last-child .ld-label { color: var(--accent); font-size: 19px; }
.ld-goal { margin: 26px 0 0; padding: 24px 26px; border-radius: 18px; background: #120A0E; color: #fff; display: grid; gap: 6px; }
.ld-goal span { font: 700 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: #FF8BAA; }
.ld-goal b { font: 800 clamp(28px, 3.6vw, 44px)/1 var(--display); text-transform: uppercase; }
@media (max-width: 960px) {
  .ld-rows > li { grid-template-columns: 1fr; gap: 12px; padding: 22px 0 18px; }
  .ld-bar { width: var(--w); }
}

/* Where it goes (investors): the web on wide screens; on a phone, the same transitions as four chains. */
.wb .sec-head { display: grid; gap: 10px; justify-items: start; margin-bottom: 22px; }
.wb-web { --wb-accent: var(--accent); --wb-ink: var(--ink); --wb-soft: var(--ink-2); --wb-box: var(--surface); --wb-line: var(--line); padding: 18px 20px 8px; border-radius: 22px; background: color-mix(in srgb, var(--accent) 5%, var(--bg)); border: 1px solid var(--line); }
.wb-web svg { display: block; width: 100%; height: auto; max-width: 1040px; margin: 0 auto; }
.wb-phone { display: none; }
.wb .ld-goal { margin-top: 22px; }
.wb .ld-goal b { font-size: clamp(24px, 2.8vw, 36px); line-height: 1.05; }
.wb-src { display: block; margin-top: 12px; }
@media (max-width: 720px) {
  .wb-web { display: none; }
  .wb-phone { display: block; }
  .wb-door { position: relative; padding: 18px 20px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); }
  .wb-door em { display: block; font: 700 11px/1 var(--body); font-style: normal; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); opacity: .85; }
  .wb-door b { display: block; font: 800 34px/1 var(--display); text-transform: uppercase; margin: 6px 0; }
  .wb-door span { color: var(--accent-ink); font-size: 15px; }
  .wb-lines { list-style: none; margin: 0; padding: 22px 0 0; display: grid; gap: 22px; position: relative; }
  .wb-lines::before { content: ""; position: absolute; top: 0; left: 22px; width: 2px; height: 50px; background: var(--accent); opacity: .5; }
  .wb-lines > li { position: relative; margin-left: 40px; display: grid; gap: 8px; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); }
  .wb-lines > li::before { content: ""; position: absolute; top: 26px; left: -18px; width: 18px; height: 2px; background: var(--accent); opacity: .5; }
  .wb-lines > li::after { content: ""; position: absolute; top: 26px; bottom: -23px; left: -18px; width: 2px; background: var(--accent); opacity: .5; }
  .wb-lines > li:last-child::after { display: none; }
  .wb-from { font: 700 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .wb-step { display: grid; gap: 4px; }
  .wb-step i { font-style: normal; font-weight: 800; font-size: 13.5px; color: var(--accent); }
  .wb-step b { font: 800 24px/1 var(--display); text-transform: uppercase; }
  .wb-loop { font-weight: 700; font-size: 13px; color: #FF8BAA; }
  .wb-pool { display: grid; gap: 2px; padding-top: 10px; border-top: 1px solid var(--line); }
  .wb-pool strong { font: 800 calc(34px + var(--i) * 8px)/1 var(--display); color: var(--accent); }
  .wb-pool small { font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .wb-lines > li.top { background: #120A0E; border-color: #120A0E; color: #fff; }
  .wb-lines > li.top .wb-from, .wb-lines > li.top .wb-pool small { color: #FF8BAA; } .wb-lines > li.top .wb-step i { color: #FF8BAA; }
  .wb-lines > li.top .wb-pool { border-color: rgb(255 255 255 / .18); } .wb-lines > li.top .wb-pool strong { color: #fff; font-size: 60px; }
}

/* Get the app: install Agape, and each role's demo as its own app */
.gt-hero { max-width: 760px; margin: 0 auto; padding: 56px 24px 18px; display: grid; gap: 10px; justify-items: start; }
.gt-hero h1 { font: 800 clamp(48px, 7vw, 84px)/.92 var(--display); text-transform: uppercase; margin: 0; }
.gt-hero .lede { margin: 0; font-size: 19px; color: var(--ink-2); max-width: 620px; }
.gt-main { max-width: 760px; margin: 10px auto 0; padding: 26px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 18px; box-shadow: 0 18px 50px rgb(0 0 0 / .06); }
@media (max-width: 800px) { .gt-main { margin: 10px 16px 0; padding: 20px; } }
.gt-app { display: flex; gap: 18px; align-items: center; }
.gt-app img { border-radius: 22px; flex: none; }
.gt-app h2 { font: 800 34px/1 var(--display); text-transform: uppercase; margin: 0 0 6px; }
.gt-app p { margin: 0; color: var(--ink-2); font-size: 16px; line-height: 1.5; }
.gt-open { justify-self: start; font-weight: 700; }
.ins { display: grid; gap: 14px; }
.ins-steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
.ins-steps li { counter-increment: s; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 12%, transparent); font-size: 16px; }
.ins-steps li::before { content: counter(s); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 14px; flex: none; }
.ins-ico { width: 20px; height: 20px; color: #0A84FF; vertical-align: -4px; }
.ins-qr { display: flex; gap: 18px; align-items: center; } .ins-qr > div { display: grid; gap: 4px; } .ins-qr span { color: var(--ink-2); }
.ins-qr .qr { flex: none; border: 1px solid var(--line); border-radius: 12px; }
.ins-fine { font-size: 13.5px; }
.ins-done { margin: 0; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, #1D7A45 12%, var(--bg)); font-weight: 700; }
.gt-demos { max-width: 1120px; margin: 0 auto; }
.gt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.gt-demo { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; padding: 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: inherit; text-decoration: none; }
.gt-demo:hover { border-color: var(--accent); }
.gt-demo img { border-radius: 14px; grid-row: span 2; }
.gt-demo > span { display: grid; gap: 2px; } .gt-demo small { font: 700 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.gt-demo b { font: 800 22px/1 var(--display); text-transform: uppercase; } .gt-demo > span > span { color: var(--ink-2); font-size: 14.5px; }
.gt-demo em { grid-column: 2; font-style: normal; font-weight: 800; color: var(--accent); font-size: 14px; }
@media (max-width: 600px) { .ins-qr { flex-direction: column; align-items: flex-start; } }
.l-install { margin: 18px auto 0; max-width: 520px; padding: 20px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 10px; }
.l-install h2 { margin: 0; font: 800 26px/1 var(--display); text-transform: uppercase; } .l-install > p { margin: 0; color: var(--ink-2); }
.join-out { display: block; text-align: center; margin-top: 8px; color: var(--ink-2); font-size: 13.5px; }
button.l-sim-link { background: none; cursor: pointer; }
/* Back, on the steps before the app itself */
.ob-back { position: absolute; z-index: 30; top: max(14px, env(safe-area-inset-top)); left: 14px; display: inline-flex; align-items: center; gap: 4px; padding: 7px 12px 7px 9px; border-radius: 999px; border: 1px solid color-mix(in srgb, currentColor 22%, transparent); background: color-mix(in srgb, var(--bg) 82%, transparent); color: var(--ink); font: 700 13.5px/1 var(--body); cursor: pointer; backdrop-filter: blur(8px); }
.ob-back span { font-size: 20px; line-height: .6; }
.device-frame .ob-back { top: 10px; left: 18px; padding: 5px 10px 5px 7px; font-size: 12.5px; }

/* The investor room */
.rm { min-height: 100vh; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
.rm-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px max(16px, calc((100vw - 900px) / 2)); border-bottom: 1px solid var(--line); background: var(--surface); }
.rm-top a { color: var(--accent); text-decoration: none; } .rm-top span { font: 700 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.rm-main { width: min(900px, 100%); margin: 0 auto; padding: 36px 16px 48px; display: grid; gap: 18px; flex: 1; align-content: start; }
.rm-hero { display: grid; gap: 10px; padding: 30px; border-radius: 24px; background: #120A0E; color: #fff; position: relative; overflow: hidden; }
.rm-hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 20%, rgb(184 23 79 / .55), transparent 55%); }
.rm-hero > * { position: relative; }
.rm-k { font: 700 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: #FF8BAA; }
.rm-hero h1, .rm-main > h1 { font: 800 clamp(40px, 6vw, 64px)/.92 var(--display); text-transform: uppercase; margin: 0; }
.rm-hero p { margin: 0; font-size: 17px; line-height: 1.5; color: rgb(255 255 255 / .88); max-width: 620px; }
.rm-docs { display: grid; gap: 10px; }
.rm-doc { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: inherit; text-decoration: none; }
.rm-doc:hover { border-color: var(--accent); }
.rm-doc > span, .rm-note-head > span { display: grid; gap: 3px; } .rm-doc b, .rm-note-head b { font: 800 22px/1.05 var(--display); text-transform: uppercase; } .rm-doc small, .rm-note-head small { color: var(--ink-2); font-size: 14.5px; line-height: 1.45; }
.rm-doc > em, .rm-note-head > em { font-style: normal; font-weight: 800; color: var(--accent); white-space: nowrap; }
.rm-ic { display: grid; place-items: center; width: 52px; height: 58px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 12%, var(--bg)); color: var(--accent); font: 800 13px/1 var(--body); font-style: normal; }
.rm-ic.link { background: #120A0E; color: #FF8BAA; border-radius: 50%; width: 52px; height: 52px; font-size: 11px; }
.rm-note { border-radius: 18px; border: 1px solid var(--line); background: var(--surface); }
.rm-note-head { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 16px 18px; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.rm-prose { padding: 0 18px 18px; font-size: 16px; line-height: 1.6; } .rm-prose h3 { font: 800 21px/1.1 var(--display); text-transform: uppercase; margin: 18px 0 6px; } .rm-prose p { margin: 0 0 10px; } .rm-prose ul { margin: 0 0 10px; padding-left: 20px; }
.rm-talk { display: grid; gap: 4px; padding: 16px 18px; border-radius: 18px; background: color-mix(in srgb, var(--accent) 7%, var(--bg)); } .rm-talk span { color: var(--ink-2); } .rm-talk a { color: var(--accent); font-weight: 700; }
.rm-foot { text-align: center; padding: 18px 16px 28px; color: var(--ink-2); font-size: 13px; }
.rm-err { font-size: 17px; color: var(--ink-2); } .rm-wait { color: var(--ink-2); }
@media (max-width: 600px) { .rm-doc { grid-template-columns: auto 1fr; } .rm-doc > em { grid-column: 2; } .rm-hero { padding: 22px; } }

/* ---------- Community: feed, posts, profile, market ---------- */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.seg.cm-places { margin: 12px 16px 0; width: calc(100% - 32px); }
.cm-places button { flex: 1; }
.cm-compose { display: grid; gap: 8px; margin: 14px 16px 4px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.cm-compose textarea { border: 0; background: transparent; resize: none; font: inherit; font-size: 15px; color: var(--ink); outline: none; min-height: 44px; }
.cm-compose > div { display: flex; justify-content: space-between; align-items: center; }
.cm-compose small { color: var(--muted); }
.cm-compose small.warn { color: #C0392B; }
.cm-scope { margin: 8px 16px 0; }
.cm-feed { display: grid; gap: 10px; padding: 12px 16px 18px; }
.pg-sec .cm-feed { padding: 0; }
.cm-post { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.cm-post header { display: flex; align-items: center; gap: 10px; }

.cm-post header time { color: var(--muted); font-size: 12px; }
.cm-av { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--sunk); color: var(--ink); font-weight: 800; flex: none; display: grid; place-items: center; }
.cm-post.team .cm-av, .cm-post.player .cm-av { color: #fff; }
.cm-tick { font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--accent-ink, #fff); background: var(--accent); padding: 1px 6px; border-radius: 99px; }
.cm-post > p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--ink); overflow-wrap: anywhere; }
.cm-post footer { display: flex; gap: 18px; }
.cm-like, .cm-reply { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 13px; padding: 4px 0; min-height: 32px; }
.cm-like.on { color: #D6336C; }
.cm-comments { list-style: none; margin: 0; padding: 8px 0 0; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 13.5px; color: var(--ink); }
.cm-comments .who, .cm-comments b { font-weight: 700; font-size: 13.5px; color: var(--ink); }
.cm-say input { min-width: 0; }
.cm-bio { margin: 4px 0 8px; font-size: 15px; line-height: 1.45; color: var(--ink); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cm-team { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 10px 3px 6px; font-weight: 600; font-size: 13px; color: var(--ink); }
.cm-team i, .cm-teams i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.cm-edit-btn { margin: 0 0 8px; }
.cm-edit { display: grid; gap: 12px; margin: 6px 0 14px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.cm-edit label { display: grid; gap: 6px; font-weight: 600; font-size: 13px; color: var(--ink-2); position: relative; }
.cm-edit input, .cm-edit textarea { font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); resize: none; }
.cm-edit label small { position: absolute; right: 10px; bottom: 8px; color: var(--muted); font-weight: 500; }
.cm-edit fieldset { border: 0; padding: 0; margin: 0; }
.cm-edit legend { font-weight: 600; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.cm-teams { display: flex; flex-wrap: wrap; gap: 6px; }
.cm-teams button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.cm-teams button.on { border-color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }
.cm-edit .sub { margin: 0; font-size: 12.5px; color: var(--muted); }
.cm-edit-go { display: flex; justify-content: flex-end; gap: 8px; }
.cm-tix, .cm-cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cm-tix li, .cm-cards li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
