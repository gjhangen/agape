.ob-form .btn.ob-primary { margin-top: 8px; }
.btn.ob-social { width: 100%; padding: 13px; border-radius: var(--r-md); background: #000; color: #fff; border: 0; font-weight: 700; }
.btn.ob-social.light { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.ob-or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.ob-or::before, .ob-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.ob-fine, .ob-sub { color: var(--muted); font-size: 13px; margin: 0; }
.ob-warn { color: var(--bad, #B42318); font-size: 13px; }
.ob-perms { gap: 16px; }
.ob-perm { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: var(--r-md); background: var(--sunk); }
.ob-perm b { display: block; margin-bottom: 3px; }
.ob-perm small { color: var(--ink-2); font-size: 14px; }
.ob-pi { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; font-size: 20px; }
.ob-venue { justify-content: center; gap: 10px; }
.ob-venue h2 { font-size: 40px; }
.ob-event { padding: 16px; border-radius: var(--r-md); border: 1px solid var(--line); display: grid; gap: 6px; }
.ob-teams { display: flex; align-items: center; gap: 8px; font-weight: 700; flex-wrap: wrap; }
.ob-teams i { width: 12px; height: 12px; border-radius: 50%; }
.ob-teams span { color: var(--muted); font-weight: 500; }
.ob-event small { color: var(--muted); }
.ob-venue .ob-acts { margin-top: 24px; }
.btn.ob-scan { width: 100%; padding: 22px; border-radius: var(--r-md); border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 800; }
.btn.ob-scan.on { animation: live-dot 1s ease-in-out infinite; }
.sf-grid.three { grid-template-columns: repeat(3, 1fr); }

/* ---------- The demo shell around the phone ---------- */
.story { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: #0E0F13; color: #F1F2F5; }
.st-top { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #0B0C10; border-bottom: 1px solid rgb(255 255 255 / .08); flex-wrap: wrap; position: relative; z-index: 3; }
.st-brand { display: flex; align-items: baseline; gap: 8px; color: #fff; text-decoration: none; }
.st-brand b { font: 800 24px/1 var(--display); color: #FF5C8A; letter-spacing: .02em; }
.st-brand span { font-size: 13px; color: rgb(255 255 255 / .6); text-transform: uppercase; letter-spacing: .12em; }
.st-levels { display: flex; gap: 4px; padding: 3px; background: rgb(255 255 255 / .06); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.st-levels button { display: flex; align-items: center; gap: 7px; padding: 7px 11px; border: 0; border-radius: 9px; background: none; color: rgb(255 255 255 / .65); white-space: nowrap; font-size: 13px; }
.st-levels button b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .1); font-size: 11.5px; }
.st-levels button.on { background: #fff; color: #111; }
.st-levels button.on b { background: #B8174F; color: #fff; }
.st-ctl { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.story .h-btn, .story .h-seg button { background: rgb(255 255 255 / .08); color: #fff; border: 1px solid rgb(255 255 255 / .12); }
.story .h-seg button.on { background: #fff; color: #111; }
.st-stage { flex: 1; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(280px, 380px) minmax(0, .6fr); gap: 40px; align-items: center; padding: 24px; overflow: hidden; }
.st-venue { position: absolute; inset: 0; pointer-events: none; }
.st-glow { position: absolute; inset: -20%; background: radial-gradient(ellipse at 40% 55%, color-mix(in srgb, var(--venue, #B8174F) 45%, transparent), transparent 60%), radial-gradient(ellipse at 80% 10%, rgb(255 255 255 / .06), transparent 50%); }
.st-glow.roar { animation: roar 2.2s ease-out both; }
@keyframes roar { 0% { opacity: .6; } 15% { opacity: 1; filter: brightness(1.8) saturate(1.3); transform: scale(1.04); } 100% { opacity: 1; } }
.st-board { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 22px; align-items: center; padding: 8px 18px; border-radius: 99px; background: rgb(0 0 0 / .45); border: 1px solid rgb(255 255 255 / .1); font: 800 17px/1 var(--display); letter-spacing: .06em; color: #fff; }

@media (max-width: 1100px) {

}
@media (max-width: 760px) {

  .st-ctl .h-seg, .st-ctl .h-btn.snd { display: none; }
  .st-stage { display: flex; flex-direction: column; padding: 0 0 16px; gap: 14px; overflow: visible; }
  .st-board, .st-moment { display: none; }
  .st-device { margin-top: 0; width: 100%; }

  .device-notch { display: none; }

/* ---------- The front door ---------- */
.site { --site-ink: #14161B; background: var(--bg); color: var(--ink); min-height: 100vh; }
.site-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px max(16px, calc(50% - 560px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.site-mark { display: flex; align-items: baseline; gap: 8px; }
.site-mark b { font: 800 28px/1 var(--display); color: var(--accent); letter-spacing: .02em; }
.site-mark span { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.site-top nav { display: flex; align-items: center; gap: 18px; }
.site-top nav a { color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 14px; }
.site-hero { padding: 72px max(16px, calc(50% - 560px)) 56px; display: grid; gap: 20px; background: radial-gradient(ellipse at 85% 0%, var(--accent-soft), transparent 60%); }
.site-hero h1 { font: 800 clamp(48px, 9vw, 104px)/.92 var(--display); text-transform: uppercase; margin: 0; letter-spacing: .01em; }
.site-hero .lede { font-size: clamp(17px, 2.2vw, 21px); line-height: 1.5; color: var(--ink-2); max-width: 680px; margin: 0; }
.site-acts { display: flex; gap: 10px; flex-wrap: wrap; }
.site-acts .btn { text-decoration: none; }
.site-sec { padding: 48px max(16px, calc(50% - 560px)); border-top: 1px solid var(--line); display: grid; gap: 18px; }
.site-sec h2 { font: 800 clamp(30px, 4.5vw, 46px)/1 var(--display); text-transform: uppercase; margin: 0; }
.site-steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.site-steps li { counter-increment: s; display: grid; gap: 6px; padding: 20px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.site-steps li::before { content: counter(s); font: 800 30px/1 var(--display); color: var(--accent); }
.site-steps b { font-size: 17px; }
.site-steps span, .site-why span, .site-why-demo { color: var(--ink-2); line-height: 1.5; }
.site-why { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.site-why div { display: grid; gap: 4px; }
.site-why b { font: 800 22px/1 var(--display); text-transform: uppercase; color: var(--accent); }
.site-why-demo { max-width: 720px; margin: 0; font-size: 17px; }
.site-seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.site-seat { display: grid; gap: 8px; align-content: start; padding: 18px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; transition: transform .15s, box-shadow .15s; }
.site-seat:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgb(0 0 0 / .08); }
.site-seat.ready { border-color: var(--accent); background: linear-gradient(160deg, var(--accent-soft), var(--surface)); }
.ss-who { font: 800 26px/1 var(--display); text-transform: uppercase; }
.site-seat.ready .ss-who { color: var(--accent); }
.ss-line { color: var(--ink-2); font-size: 14.5px; line-height: 1.45; }
.ss-meta { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.site-behind { display: grid; gap: 4px; padding: 16px 18px; border-radius: var(--r-lg); background: var(--board); color: var(--board-ink); text-decoration: none; }

.site-levels { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }

.site-levels li:first-child { background: var(--accent-soft); }
.site-levels span { color: var(--ink-2); font-size: 14px; }
.site-foot { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 28px max(16px, calc(50% - 560px)) 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }

@media (max-width: 600px) { .site-top nav a { display: none; } .site-hero { padding-top: 44px; } }
.story .h-seg { background: rgb(255 255 255 / .06); border-color: rgb(255 255 255 / .12); }

.scope-body { grid-auto-rows: max-content; }

.device-screen .overlay-page { padding-top: 46px; }

.device-screen .live-page .op-body { background: var(--bg); }
.site-acts .btn:not(.primary) { color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
.site-acts .btn { font-family: var(--body); font-weight: 700; text-transform: none; letter-spacing: 0; }
@media (max-width: 760px) { .device-screen .overlay-page { padding-top: 0; } }

/* ---------- Explain mode (the demo's layer, over the device) ---------- */

.explain-box { position: absolute; pointer-events: auto; border: 2px solid #FFC94D; border-radius: 12px; background: rgb(255 201 77 / .10); box-shadow: 0 0 0 3px rgb(255 201 77 / .25), 0 0 18px rgb(255 201 77 / .45); cursor: help; animation: ex-glow 2s ease-in-out infinite; }
.explain-box.on { background: rgb(255 201 77 / .22); animation: none; box-shadow: 0 0 0 4px #FFC94D; }
@keyframes ex-glow { 50% { box-shadow: 0 0 0 5px rgb(255 201 77 / .15), 0 0 26px rgb(255 201 77 / .6); } }
.story .h-btn.lit { background: #FFC94D; color: #111; border-color: #FFC94D; }

.explain-card { display: grid; gap: 12px; animation: ob-in .3s ease both; }

/* ---------- Devices for staff: tablet and laptop ---------- */
.st-seats { display: flex; gap: 2px; padding: 3px; background: rgb(255 255 255 / .06); border-radius: 12px; }
.st-seats a { padding: 7px 12px; border-radius: 9px; color: rgb(255 255 255 / .65); text-decoration: none; font-size: 13px; font-weight: 600; }

.story.tablet .st-stage, .story.laptop .st-stage { grid-template-columns: minmax(0, 1fr) auto minmax(260px, 340px) minmax(0, .3fr); gap: 32px; }

@media (max-width: 1100px) {

@media (max-width: 760px) {
  .device-frame.tablet, .device-frame.laptop { width: 100%; height: calc(100svh - 150px); padding: 0; border-radius: 0; box-shadow: none; }
  .device-frame.laptop::after { display: none; }
  .device-frame.tablet .device-screen, .device-frame.laptop .device-screen { border-radius: 0; }
}
.ob-mark small { display: block; text-align: center; color: rgb(255 255 255 / .8); font: 600 14px/1 var(--body); letter-spacing: .3em; text-transform: uppercase; margin-top: 8px; }
.ob-logo.dark { color: var(--accent); }

/* ---------- Agape Crew ---------- */
.crew-app .scope-body { padding-bottom: 20px; }
.cw-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.cw-online { display: flex; align-items: center; gap: 8px; border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 800; background: var(--sunk); color: var(--muted); }
.cw-online i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.cw-online.on { background: #E2F3E8; color: #1D7A45; }
.cw-online.on i { background: #1D7A45; animation: live-dot 1.6s ease-in-out infinite; }
.cw-where { color: var(--muted); font-size: 13px; }
.cw-hero { display: grid; gap: 10px; padding: 28px 18px; text-align: center; justify-items: center; }
.cw-hero h2 { font: 800 26px/1.05 var(--display); text-transform: uppercase; margin: 0; }
.cw-hero p { color: var(--ink-2); margin: 0; font-size: 14.5px; }

@keyframes radar { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 100% { box-shadow: 0 0 0 36px transparent; } }
.cw-offer { margin: 14px; padding: 18px; border-radius: var(--r-lg); background: var(--board); color: var(--board-ink); display: grid; gap: 8px; box-shadow: 0 14px 40px rgb(0 0 0 / .25); animation: ob-in .3s ease both; }
.cw-offer .eyebrow { color: color-mix(in srgb, var(--board-ink) 70%, transparent); }

.cw-pay { font: 800 56px/1 var(--display); }
.cw-timer { font-weight: 800; color: #FFC94D; }
.cw-route { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14.5px; }
.cw-offer .btn.ghost { color: var(--board-ink); border-color: color-mix(in srgb, var(--board-ink) 30%, transparent); background: transparent; }
.cw-steps { margin: 14px; display: grid; gap: 10px; }
.cw-step { display: flex; gap: 12px; padding: 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); opacity: .6; }
.cw-step.here { opacity: 1; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.cw-step.done { opacity: .55; }
.cw-step.done .cw-n { background: #1D7A45; }
.cw-step .grow { display: grid; gap: 4px; }
.cw-step small { color: var(--ink-2); }
.cw-n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
.cw-check { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: var(--r-md); background: var(--sunk); }
.cw-check b { display: block; } .cw-check small { color: var(--ink-2); }

.cw-shift { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.cw-shift.on { border-color: var(--accent); }
.cw-shift small { display: block; color: var(--ink-2); }
.cw-hot { color: var(--accent) !important; font-weight: 700; }
.cw-earn { display: grid; gap: 8px; }
.cw-earn-big { font: 800 52px/1 var(--display); color: var(--accent); }
.cw-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 120px; align-items: end; }
.cw-bars div { display: grid; gap: 4px; justify-items: center; height: 100%; align-content: end; }
.cw-bars i { width: 100%; background: var(--accent); border-radius: 6px 6px 2px 2px; opacity: .85; }
.cw-bars small { color: var(--muted); font-size: 11px; }

/* ---------- Agape Station ---------- */

.pin-pad button:disabled { visibility: hidden; }
.sx-setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }

.sx-app, .lp-app { position: absolute; inset: 0; display: flex; background: var(--bg); }
.sx-nav, .lp-nav { width: 78px; flex: none; display: grid; align-content: start; gap: 6px; padding: 14px 8px; background: var(--board); color: var(--board-ink); }

.sx-top { display: flex; align-items: center; gap: 16px; padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--line); }

.sx-wait { display: grid; text-align: right; } .sx-wait b { font-size: 26px; color: var(--accent); }

.sx-open.on { background: #E2F3E8; color: #1D7A45; }
.sx-cols { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; overflow: hidden; }
.sx-col { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 10px; border-radius: var(--r-lg); background: var(--sunk); }
.sx-col h3 { display: flex; justify-content: space-between; font: 800 16px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; margin: 2px 4px 4px; }

.sx-ticket { background: var(--surface); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); display: grid; gap: 6px; animation: ob-in .3s ease both; }

.sx-ticket ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 14px; }
.sx-ticket li { display: flex; align-items: center; gap: 6px; }
.sx-report { padding: 18px; display: grid; gap: 12px; align-content: start; overflow-y: auto; }

/* ---------- Agape Venue (laptop) ---------- */
.lp-signin { align-items: center; justify-content: center; background: var(--bg); }
.lp-card { width: min(420px, 100%); display: grid; gap: 12px; padding: 28px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: 0 20px 60px rgb(0 0 0 / .08); }

.st-stage { overflow: clip; }

@media (max-width: 1100px) {

}
@media (max-width: 760px) {
