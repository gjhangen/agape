<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><title>Agape Admin</title>
<meta name="theme-color" content="#B8174F"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@400;600;700&family=Rubik:wght@400;500;600;700&display=swap"><style>:root {
  --bg: #F4F5F8; --card: #FFFFFF; --ink: #14161B; --muted: #5E6573; --line: #E2E5EB; --sunk: #EEF0F4;
  --brand: #B8174F; --brand-ink: #FFFFFF; --brand-soft: #F8E6ED; --good: #1D7A45; --good-soft: #E2F3E8; --warn: #9A5B00; --warn-soft: #FFF1D6; --bad: #B42318; --bad-soft: #FDE8E6;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0E1014; --card: #171A20; --ink: #EDEFF3; --muted: #9AA1AE; --line: #2A2F38; --sunk: #1F232A; --brand: #E0457C; --brand-soft: #3A1625; --good: #5BC98A; --good-soft: #15301F; --warn: #F0B54A; --warn-soft: #33270F; --bad: #F2766B; --bad-soft: #3A1714; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Public Sans", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono, code { font-family: var(--mono); font-size: .92em; }
h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }
h2 { font-size: 17px; margin: 0 0 2px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
small { display: block; color: var(--muted); font-size: 12.5px; }
.ox-sub { color: var(--muted); margin: 0 0 14px; max-width: 70ch; }
.ox-sub code { background: var(--sunk); padding: 2px 6px; border-radius: 6px; user-select: all; }
.ox-mark { display: flex; align-items: baseline; gap: 6px; }
.ox-mark b { font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 26px; color: var(--brand); letter-spacing: .01em; }
.ox-mark span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }

.ox-btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; min-height: 40px; white-space: nowrap; }
.ox-btn:hover:not(:disabled) { border-color: var(--muted); }
.ox-btn:focus-visible, .ox-link:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .ox-nav button:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 2px; }
.ox-btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.ox-btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--brand); }
.ox-btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.ox-btn.ghost { background: transparent; }
.ox-btn.sm { padding: 6px 12px; min-height: 34px; font-size: 13.5px; }
.ox-btn.block { width: 100%; margin-top: 8px; }
.ox-btn:disabled { opacity: .5; cursor: not-allowed; }
.ox-link { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; cursor: pointer; text-align: left; }
.ox-link.strong { color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.ox-link.strong:hover { text-decoration-color: var(--brand); }
.ox-link.danger { color: var(--bad); margin-top: 14px; font-size: 13.5px; }

.ox-f { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; min-width: 0; }
.ox-f > span { font-weight: 600; font-size: 13.5px; }
.ox-f input, .ox-f select, .ox-f textarea, .ox-search, .ox-table select { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 42px; }
.ox-f textarea { resize: vertical; line-height: 1.45; }
.ox-f input:disabled, .ox-f select:disabled, .ox-f textarea:disabled { background: var(--sunk); color: var(--ink); opacity: 1; }
.ox-req { color: var(--brand); font-style: normal; margin-left: 4px; }
.ox-err { color: var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 9px 12px; margin: 4px 0 10px; font-weight: 600; }
.ox-ok { color: var(--good); background: var(--good-soft); border-radius: 10px; padding: 9px 12px; font-weight: 600; }
.ox-note { background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; }
.ox-fine { color: var(--muted); font-size: 13px; margin-top: 16px; }
.ox-muted { color: var(--muted); }
.ox-empty { color: var(--muted); padding: 24px 0; }
.ox-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.ox-row.between { justify-content: space-between; margin: 0; }

/* sign in, set up, invitations */
.ox-gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.ox-gate-card { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.06); }
.ox-gate-card .ox-mark { margin-bottom: 20px; }
.ox-gate-card h1 { font-size: 24px; }
.ox-gate-foot { margin-top: 16px; }

/* signed in */
.ox-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 20px; padding: 10px 24px; background: color-mix(in srgb, var(--card) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.ox-nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.ox-nav button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.ox-nav button:hover { color: var(--ink); background: var(--sunk); }
.ox-nav button.on { color: var(--ink); background: var(--sunk); box-shadow: inset 0 -2px 0 var(--brand); }
.ox-who { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; text-align: right; }
.ox-main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }
.ox-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.ox-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ox-search { width: 260px; }
.ox-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; }
.ox-card.narrow { max-width: 520px; }
.ox-blank { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 40px 28px; text-align: center; }
.ox-blank p { color: var(--muted); max-width: 56ch; margin: 8px auto 18px; }

.ox-table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.ox-card .ox-table-wrap { border: 0; border-radius: 0; margin: 0 -22px -20px; }
.ox-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ox-table th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ox-table td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ox-table tr:last-child td { border-bottom: 0; }
.ox-table tr.off td { opacity: .55; }
.ox-table tr.pending td { background: var(--sunk); }
.ox-table select { min-height: 34px; padding: 4px 8px; width: auto; }
.ox-meter { display: inline-block; width: 72px; height: 6px; border-radius: 9px; background: var(--sunk); overflow: hidden; vertical-align: middle; margin-right: 8px; }
.ox-meter i { display: block; height: 100%; background: var(--brand); border-radius: 9px; }
.ox-table td small { display: inline; }
.ox-table td > small:first-child, .ox-table td button + small { display: block; }
.ox-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.ox-tag.requested { background: var(--warn-soft); color: var(--warn); }
.ox-tag.issued { background: var(--brand-soft); color: var(--brand); }
.ox-tag.live { background: var(--good-soft); color: var(--good); }

/* editing a merchant */
.ox-edit { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.ox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); column-gap: 16px; }
.ox-f.wide { grid-column: 1 / -1; }
.ox-side .sticky { position: sticky; top: 84px; }
.ox-status { display: flex; flex-direction: column; gap: 6px; }
.ox-status label { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.ox-status label.on { border-color: var(--brand); background: var(--brand-soft); }
.ox-status input { margin-top: 4px; accent-color: var(--brand); }
.ox-missing { margin: 0 0 12px; padding-left: 18px; color: var(--muted); font-size: 14px; columns: 2; column-gap: 16px; }

.ox-invite { display: grid; grid-template-columns: 1fr 1.3fr 1.4fr auto; gap: 12px; align-items: end; }
.ox-invite .ox-btn { margin-bottom: 14px; min-height: 42px; }
.ox-linkbox { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--good-soft); border-radius: 10px; padding: 12px 14px; }
.ox-linkbox span { font-weight: 600; width: 100%; }
.ox-linkbox code { flex: 1; min-width: 0; overflow-wrap: anywhere; user-select: all; }

.ox-leads { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.ox-card.lead { margin: 0; padding: 16px 18px; }
.ox-card.lead p { white-space: pre-wrap; margin: 8px 0 0; }
.ox-meta { color: var(--muted); font-size: 13.5px; }
.ox-card.lead a { color: var(--brand); font-weight: 600; }
.ox-log { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.ox-log li { display: grid; grid-template-columns: 150px 160px 1fr; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
.ox-log li:last-child { border-bottom: 0; }
.ox-log time { color: var(--muted); }
.ox-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 600; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.2); }

/* who the VAR sheet copy is for */
.ox-copy { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; margin-bottom: 18px; }
.ox-copy > span { align-self: center; font-weight: 600; margin-right: 4px; }
.ox-copy button { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.ox-copy button.on { border-color: var(--brand); background: var(--brand-soft); }

/* the VAR sheet itself: a printed page, always light */
.var-sheet { --ink: #14161B; --muted: #5E6573; --line: #D9DDE4; color: var(--ink); background: #fff; max-width: 8.5in; margin: 0 auto; padding: .6in .65in; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.12); font-size: 12.5px; line-height: 1.4; color-scheme: light; }
.var-top { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: start; padding-bottom: 14px; border-bottom: 3px solid #B8174F; }
.var-brand b { display: block; font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 30px; line-height: 1; color: #B8174F; }
.var-brand span { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
.var-title h1 { font-size: 22px; margin: 0; text-transform: uppercase; letter-spacing: .04em; }
.var-title span { color: var(--muted); font-size: 12px; }
.var-ref { margin: 0; display: grid; gap: 2px; font-size: 11.5px; text-align: right; }
.var-ref div { display: flex; gap: 8px; justify-content: flex-end; }
.var-ref dt { color: var(--muted); }
.var-ref dd { margin: 0; font-weight: 700; }
.var-who { padding: 14px 0 6px; }
.var-who h2 { font-size: 20px; margin: 0; }
.var-who p { margin: 2px 0 0; color: var(--muted); }
.var-pending { background: #FFF6E3; border-left: 3px solid #C98200; padding: 7px 10px; margin: 8px 0 4px; font-size: 11.5px; }
.var-sec { margin-top: 12px; break-inside: avoid; }
.var-sec h3 { color: #B8174F; font-size: 11px; margin: 0 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.var-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px 18px; margin: 0; }
.var-grid div { min-width: 0; }
.var-grid div.wide { grid-column: 1 / -1; }
.var-grid dt { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.var-grid dd { margin: 1px 0 0; font-weight: 600; overflow-wrap: anywhere; min-height: 18px; }
.var-grid dd.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: .02em; }
.var-line { display: block; border-bottom: 1px solid #A9B0BB; height: 16px; }
.var-notes { white-space: pre-wrap; margin: 0; }
.var-signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding-top: 22px; }
.var-signs small { font-size: 10px; margin-top: 4px; }
.var-foot { display: flex; justify-content: space-between; gap: 20px; margin-top: 22px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 10px; color: var(--muted); }

@media (max-width: 900px) {
  .ox-edit { grid-template-columns: 1fr; }
  .ox-side .sticky { position: static; }
  .ox-invite { grid-template-columns: 1fr; }
  .ox-invite .ox-btn { margin-bottom: 0; }
}
@media (max-width: 640px) {
  .ox-top { flex-wrap: wrap; padding: 10px 16px; gap: 8px 12px; }
  .ox-nav { order: 3; flex-basis: 100%; }
  .ox-who { margin-left: auto; }
  .ox-who span small { display: none; }
  .ox-main { padding: 20px 16px 72px; }
  h1 { font-size: 22px; }
  .ox-search { width: 100%; }
  .ox-card { padding: 16px; }
  .ox-card .ox-table-wrap { margin: 0 -16px -16px; }
  .ox-log li { grid-template-columns: 1fr; gap: 0; }
  .var-sheet { padding: 20px 16px; font-size: 12px; }
  .var-top { grid-template-columns: 1fr; gap: 10px; }
  .var-ref { text-align: left; }
  .var-ref div { justify-content: flex-start; }
  .var-grid { grid-template-columns: repeat(2, 1fr); }
  .var-signs { grid-template-columns: 1fr; }
  .var-foot { flex-direction: column; gap: 4px; }
}
@media print {
  @page { size: letter; margin: .45in .55in; }
  html, body { background: #fff !important; }
  .ox-top, .noprint, .ox-toast { display: none !important; }
  .ox-main { padding: 0; max-width: none; }
  .var-sheet { box-shadow: none; border-radius: 0; max-width: none; padding: 0; font-size: 11px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .var-grid { grid-template-columns: repeat(4, 1fr); gap: 5px 16px; }
  .var-grid dd { min-height: 15px; }
  .var-sec { margin-top: 9px; }
  .var-signs { padding-top: 16px; }
}

.nowrap { white-space: nowrap; }
@media (max-width: 640px) {
  .ox-table.merch thead { display: none; }
  .ox-table.merch tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .ox-table.merch tr:last-child { border-bottom: 0; }
  .ox-table.merch td { display: block; padding: 0; border: 0; }
  .ox-table.merch td:first-child, .ox-table.merch td:last-child { grid-column: 1 / -1; }
  .ox-table.merch td[data-l]::before { content: attr(data-l); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
  .ox-table.merch td:last-child .ox-btn { width: 100%; margin-top: 4px; }
}

.ox-badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 99px; background: var(--brand); color: var(--brand-ink); font-size: 11px; font-style: normal; line-height: 18px; text-align: center; }
.ox-tree, .ox-tree ul { list-style: none; margin: 0; padding: 0; }
.ox-tree ul { margin-left: 22px; padding-left: 18px; border-left: 2px solid var(--line); }
.ox-tree li { padding-top: 8px; }
.ox-node { display: inline-flex; flex-direction: column; border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 10px; padding: 8px 14px; background: var(--card); min-width: 220px; }
.ox-node span { color: var(--muted); font-size: 13px; }
.ox-node.host { border-left-color: var(--brand); } .ox-node.admin { border-left-color: #6D4BD8; } .ox-node.manager { border-left-color: #1F7FC4; } .ox-node.member { border-left-color: var(--good); }
.ox-node.you { background: var(--brand-soft); } .ox-node.off { opacity: .5; }
.ox-node small { display: inline; }
.ox-invite { grid-template-columns: 1fr 1.2fr 1fr .9fr 1fr auto; }
.ox-seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.ox-seg button { border: 0; background: none; padding: 7px 14px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; }
.ox-seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.ox-inbox { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ox-inbox li { border-bottom: 1px solid var(--line); }
.ox-inbox li:last-child { border-bottom: 0; }
.ox-msg { display: grid; grid-template-columns: 220px 1fr auto; gap: 14px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: 12px 16px; cursor: pointer; }
.ox-msg:hover { background: var(--sunk); }
.ox-inbox li.unread .ox-from, .ox-inbox li.unread .ox-subj b { font-weight: 800; }
.ox-inbox li.unread .ox-msg { box-shadow: inset 3px 0 0 var(--brand); }
.ox-from { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ox-subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ox-msg time { color: var(--muted); font-size: 13px; white-space: nowrap; }
.ox-body { padding: 0 16px 16px; }
.ox-body p { white-space: pre-wrap; margin: 0 0 8px; }
.ox-meta { color: var(--muted); font-size: 13px; }
@media (max-width: 900px) { .ox-invite { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) { .ox-msg { grid-template-columns: 1fr auto; } .ox-subj { grid-column: 1 / -1; } .ox-invite { grid-template-columns: 1fr; } .ox-node { min-width: 0; } }

.ox-node.group { border-left-color: #6D4BD8; background: color-mix(in srgb, #6D4BD8 8%, var(--card)); }
.ox-subform { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 6px 0 16px; background: var(--bg); }
.ox-subform h3 { margin-top: 0; }
.ox-checks { border: 0; padding: 0; margin: 0 0 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 16px; }
.ox-checks.perms { grid-template-columns: 1fr; }
.ox-checks legend { font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
.ox-checks label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.ox-checks input { accent-color: var(--brand); margin-top: 3px; }
.ox-row select { min-height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--card); }
.ox-row.between { flex-wrap: wrap; gap: 10px; }
.ox-node.host { border-left-color: var(--brand); }
.ox-table td > b + small { display: block; }

.ox-flag { font-style: normal; font-size: 11px; font-weight: 700; color: var(--bad); background: var(--bad-soft); border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
.ox-status { list-style: none; padding: 0; margin: 8px 0; font-size: 13px; }
.ox-status li { padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; overflow-wrap: anywhere; }
.ox-status li.good { background: var(--good-soft); } .ox-status li.bad { background: var(--bad-soft); }
.ox-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--card); min-height: 42px; }
.ox-chips input { border: 0 !important; min-height: 28px !important; padding: 2px 4px !important; flex: 1; min-width: 160px; outline: none; background: transparent; }
.ox-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--brand-soft); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 13.5px; font-weight: 600; }
.ox-chip button { border: 0; background: none; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; color: var(--muted); }
.ox-f > select { margin-top: 6px; }
.ox-checklist { list-style: none; margin: 0; padding: 0; }
.ox-checklist li { display: grid; grid-template-columns: minmax(200px, 340px) 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.ox-checklist li:last-child { border-bottom: 0; }
.ox-checklist li.good b { color: var(--good); } .ox-checklist li.bad b { color: var(--bad); }
.ox-checklist span { overflow-wrap: anywhere; }
.ox-wrap { display: block; overflow-wrap: anywhere; word-break: break-all; font-size: 12px; max-width: 560px; }
.ox-steps { padding-left: 20px; margin: 0 0 14px; } .ox-steps li { margin-bottom: 8px; }
.ox-code { position: relative; background: var(--sunk); border-radius: 10px; padding: 14px; overflow-x: auto; }
.ox-code pre { margin: 0; font-family: var(--mono); font-size: 12.5px; white-space: pre; }
.ox-code .ox-btn { position: absolute; right: 10px; top: 10px; }
@media (max-width: 640px) { .ox-checklist li { grid-template-columns: 1fr; gap: 2px; } }

.ox-badge.soft { background: var(--sunk); color: var(--ink); border: 1px solid var(--line); }
.ox-kind { font-style: normal; font-size: 11px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
.ox-channels { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.ox-chanlist { display: flex; flex-direction: column; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px; position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow-y: auto; }
.ox-chanlist button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 0; background: none; border-radius: 9px; padding: 9px 10px; cursor: pointer; font-weight: 600; }
.ox-chanlist button:hover { background: var(--sunk); }
.ox-chanlist button.on { background: var(--brand-soft); }
.ox-chanlist button.muted span { opacity: .6; }
.ox-chanlist small { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
.ox-chanhead { margin-bottom: 12px; }
.ox-chanhead h2 { margin: 0; }
.ox-checkline { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; cursor: pointer; }
.ox-checkline input { accent-color: var(--brand); width: 18px; height: 18px; }
@media (max-width: 760px) { .ox-channels { grid-template-columns: 1fr; } .ox-chanlist { position: static; max-height: none; flex-direction: row; overflow-x: auto; } .ox-chanlist button { flex: none; } }

.var-line.short { display: inline-block; width: 110px; vertical-align: bottom; }
.var-sheet .var-line { min-height: 22px; }
.ox-mark svg.wordmark { display: block; height: 40px; width: auto; color: var(--brand); margin-left: -4px; }
.ox-mark { align-items: center; }
.var-brand svg.wordmark { display: block; height: 58px; width: auto; color: #B8174F; --wm-tag: #14161B; margin-left: -6px; }

.ox-files { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.ox-files > span { font-size: 13px; font-weight: 700; color: var(--muted); margin-right: 4px; }

/* ---------------- venues and their nights ---------------- */
.ox-row.wrap { flex-wrap: wrap; }
.ox-row.center { justify-content: center; }
.ox-tag.bad { background: var(--bad-soft); color: var(--bad); }
.ox-venues { display: grid; gap: 14px; }
.ox-venue h2 { margin: 0; }
.ox-venue.live { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.ox-vstat { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.ox-vstat b { color: var(--ink); }
.ox-formtable td { padding: 6px 6px; vertical-align: top; }
.ox-formtable input:not([type=checkbox]), .ox-formtable select { width: 100%; min-width: 64px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-height: 38px; }
.ox-formtable td:first-child input { min-width: 150px; }
.ox-formtable input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand); margin-top: 10px; }
.ox-missing.one { columns: 1; }
.ox-given { border: 2px solid var(--brand); }
.ox-given dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 6px 0 4px; }
.ox-given dt { color: var(--muted); font-weight: 600; }
.ox-given dd { margin: 0; font-weight: 700; }
.ox-given dd.big { font-size: 22px; letter-spacing: .04em; user-select: all; }
.ox-console { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.ox-console.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.ox-console > .ox-card { margin: 0; }
.ox-score { display: grid; grid-template-columns: 1fr auto auto auto 1fr; align-items: center; gap: 14px; margin: 4px 0 14px; }
.ox-score b { font-size: 44px; line-height: 1; font-weight: 800; }
.ox-team { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; justify-content: flex-end; }
.ox-team.right { justify-content: flex-start; }
.ox-team i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.ox-period { font-weight: 800; background: var(--sunk); border-radius: 8px; padding: 4px 10px; min-width: 76px; text-align: center; }
.ox-scorepad { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.ox-scorepad .ox-row { margin-top: 4px; flex-wrap: wrap; }
.ox-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px 16px; align-content: start; }
.ox-kpis b { display: block; font-size: 24px; font-weight: 800; }
.ox-kpis > .ox-row { grid-column: 1 / -1; margin-top: 4px; }
.ox-okt { color: var(--good); }
.ox-badt { color: var(--bad); }
.ox-table.tight td, .ox-table.tight th { padding: 7px 8px; }
.ox-table tr.late td { background: var(--warn-soft); }
.ox-table.books td.num { text-align: right; white-space: nowrap; font-weight: 700; }
.ox-problem { border-top: 1px solid var(--line); padding: 8px 0; }
@media (max-width: 860px) { .ox-console, .ox-console.two { grid-template-columns: 1fr; } .ox-score b { font-size: 34px; } }
@media print { .ox-report .ox-card { break-inside: avoid; border: 1px solid #ccc; } .ox-report .ox-acts { display: none; } }
.ox-formtable + .ox-btn, .ox-table-wrap + .ox-btn { margin-top: 10px; }

/* seat signs: four to a letter page */
.ox-signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.ox-sign { background: #fff; color: #111; border: 1px dashed #bbb; border-radius: 14px; padding: 22px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; break-inside: avoid; }
.ox-sign-mark svg { height: 34px; width: auto; }
.ox-sign-head { font-weight: 800; font-size: 22px; margin: 0; letter-spacing: -.01em; }
.ox-sign-sec { font-size: 20px; margin: 0; } .ox-sign-sec b { font-size: 34px; }
.ox-sign-how { font-size: 13px; color: #444; margin: 0; max-width: 32ch; }
.ox-sign-url { font-size: 10.5px; color: #777; margin: 0; font-family: var(--mono); word-break: break-all; }
@media print {
  .ox-signs-page .ox-head, .ox-signs-page .noprint, .ox-nav { display: none !important; }
  .ox-signs { grid-template-columns: 1fr 1fr; gap: 0; }
  .ox-sign { height: 4.9in; border-radius: 0; justify-content: center; }
}
/* payouts: each business Agape pays, and what each is owed after a night */
.ox-payouts { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.ox-payouts h3 { margin: 0; font-size: 14px; }
.ox-payee { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.ox-payee > div:first-child { display: grid; gap: 2px; } .ox-payee small { color: var(--muted); }
.ox-payee > .ox-row { grid-column: 1 / -1; }
.ox-payee input { min-width: 240px; }
.ox-owed .num { text-align: right; } .ox-owed .ox-total td { border-top: 2px solid var(--line); }
/* what Agape brought a local business: a page to hand them */
.brought { display: grid; gap: 18px; padding: 28px; }
.brought header { display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.brought header h1 { margin: 0; font-size: 28px; } .brought header p { margin: 4px 0 0; color: var(--muted); }
.brought-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.brought-kpis > div { display: grid; gap: 4px; padding: 16px; border-radius: 14px; background: var(--bg); }
.brought-kpis b { font-size: 34px; line-height: 1; color: var(--accent, #B8174F); } .brought-kpis span { font-size: 13.5px; color: var(--muted); }
.brought-sales { margin: 0; font-weight: 600; }
.brought-ask { margin: 0; padding: 14px 16px; border-left: 3px solid var(--accent, #B8174F); background: var(--bg); font-size: 15px; }
@media (max-width: 760px) { .brought-kpis { grid-template-columns: 1fr 1fr; } }
@media print { .no-print, .ox-top, .ox-head button { display: none !important; } .brought { border: 0; box-shadow: none; } }
.brought header > :first-child { height: 40px; width: auto; max-width: 200px; flex: none; } .brought header svg { height: 40px; width: auto; }

/* Brand: the logo boards, app looks and every exploration round, for signed-in team members. */
.bx-sec { margin: 0 0 30px; }
.bx-sec h2 { margin: 6px 0 4px; font-size: 22px; }
.bx-tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--warn-soft); color: var(--warn); }
.bx-tag.ok { background: var(--good-soft); color: var(--good); }
.bx-final { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 12px; }
.bx-wide { margin-top: 12px; }
.bx-pic { display: grid; gap: 6px; width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: zoom-in; text-align: left; font: inherit; color: inherit; }
.bx-pic:hover { border-color: var(--brand); }
.bx-pic img { display: block; width: 100%; height: auto; border-radius: 6px; background: var(--sunk); }
.bx-pic small { color: var(--muted); font-weight: 600; font-size: 13px; }
.bx-wait { display: grid; place-items: center; aspect-ratio: 16 / 10; border-radius: 6px; background: var(--sunk); color: var(--muted); font-size: 13px; }
.bx-round { border: 1px solid var(--line); border-radius: 14px; background: var(--card); margin-top: 10px; }
.bx-round > summary { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; list-style: none; }
.bx-round > summary::-webkit-details-marker { display: none; }
.bx-round > summary::after { content: "Show"; margin-left: auto; color: var(--brand); font-weight: 700; font-size: 13px; }
.bx-round[open] > summary::after { content: "Hide"; }
.bx-round > summary small { color: var(--muted); }
.bx-n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 800; font-size: 13px; flex: none; }
.bx-round > .ox-sub, .bx-group { padding: 0 16px; }
.bx-group { padding-bottom: 16px; }
.bx-group h3 { margin: 8px 0 2px; font-size: 16px; }
.bx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 10px; }
.bx-view { position: fixed; inset: 0; z-index: 200; background: rgb(8 9 12 / .82); display: grid; place-items: center; padding: 16px; }
.bx-view-in { width: min(1400px, 100%); max-height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; background: var(--card); border-radius: 16px; padding: 14px; }
.bx-view-top { display: flex; align-items: center; gap: 12px; } .bx-view-top span { color: var(--muted); margin-left: auto; white-space: nowrap; }
.bx-view-img { overflow: auto; } .bx-view-img .bx-pic { cursor: default; border: 0; padding: 0; } .bx-view-img .bx-pic small { display: none; }
.bx-view-nav { display: flex; justify-content: space-between; gap: 10px; }
@media (max-width: 720px) { .bx-final { grid-template-columns: 1fr; } .bx-grid { grid-template-columns: 1fr; } }
.bx-grid:has(> .bx-pic:only-child) { grid-template-columns: minmax(0, 900px); }
.ox-fold > summary { display: flex; align-items: baseline; gap: 12px; cursor: pointer; list-style: none; }
.ox-fold > summary::-webkit-details-marker { display: none; }
.ox-fold > summary h2 { margin: 0; }
.ox-fold > summary small { color: var(--muted); }
.ox-fold > summary::after { content: "Show"; margin-left: auto; color: var(--brand); font-weight: 700; font-size: 13px; }
.ox-fold[open] > summary::after { content: "Hide"; }
.ox-fold[open] > summary { margin-bottom: 12px; }
.ox-shared { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
.ox-shared li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
.ox-shared li > div:first-child { display: grid; gap: 2px; } .ox-shared li span, .ox-shared small { color: var(--muted); }
.ox-addr { display: flex; align-items: center; gap: 6px; } .ox-addr input { flex: 1; } .ox-addr small { color: var(--muted); font-weight: 600; }
.ox-checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
fieldset.ox-f { border: 0; padding: 0; margin: 0; min-width: 0; }
.ox-check { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
.ox-check input { width: 18px; height: 18px; accent-color: var(--brand); }
/* Directory: everyone at Agape, and a profile for each */
.dir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; margin-top: 14px; }
.dir-card { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: inherit; font: inherit; cursor: pointer; }
.dir-card:hover { border-color: var(--brand); } .dir-card.you { background: var(--brand-soft); }
.dir-av { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); font-style: normal; font-weight: 800; font-size: 15px; }
.dir-av.big { width: 64px; height: 64px; font-size: 22px; }
.dir-who { display: grid; gap: 1px; min-width: 0; } .dir-who small { color: var(--muted); }
.dir-addr { color: var(--brand); font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
.dir-view { position: fixed; inset: 0; z-index: 200; background: rgb(8 9 12 / .6); display: grid; place-items: center; padding: 16px; }
.dir-prof { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--card); border-radius: 18px; padding: 20px; display: grid; gap: 16px; }
.dir-top { display: flex; gap: 14px; align-items: center; } .dir-top h2 { margin: 0; } .dir-top span { color: var(--muted); } .dir-top > button { margin-left: auto; align-self: flex-start; }
.dir-mail { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--sunk); }
.dir-facts { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
.dir-facts dt { color: var(--muted); font-weight: 600; } .dir-facts dd { margin: 0; display: grid; } .dir-facts dd small { color: var(--muted); }
.dir-facts dd:has(> .ox-link) { display: block; }
@media (max-width: 560px) { .dir-facts { grid-template-columns: 1fr; gap: 2px; } .dir-facts dd { margin-bottom: 8px; } }
.dir-view { grid-template-columns: minmax(0, 560px); justify-content: center; }
.dir-prof { width: 100%; min-width: 0; box-sizing: border-box; }
.dir-mail b, .dir-facts dd { overflow-wrap: anywhere; min-width: 0; }
.dir-top > div { min-width: 0; }
.ox-seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; } .ox-seg::-webkit-scrollbar { display: none; }
.ox-seg button { white-space: nowrap; flex: none; }
/* Investor room */
.rmx-guests { display: grid; gap: 10px; margin-top: 14px; }
.rmx-guest { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; } .rmx-guest.off { opacity: .6; }
.rmx-who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; } .rmx-who small { color: var(--muted); } .rmx-who span { margin-left: auto; color: var(--muted); font-size: 13.5px; } .rmx-who span.seen { color: var(--good); font-weight: 700; }
.rmx-views { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; } .rmx-views b { color: var(--ink); font-weight: 600; }
.rmx-items { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.rmx-items > li { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; }
.rmx-items > li.hid { border-style: dashed; background: var(--sunk); }
.rmx-item { display: flex; gap: 12px; align-items: center; min-width: 0; flex: 1 1 320px; } .rmx-item > div { display: grid; gap: 2px; min-width: 0; } .rmx-item small { color: var(--muted); overflow-wrap: anywhere; }
.rmx-kind { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font: 800 11px/1 var(--mono); font-style: normal; }
.rmx-hid { justify-self: start; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-size: 12px; font-weight: 700; }
.rmx-form { width: 100%; margin: 6px 0; }
