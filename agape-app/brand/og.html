<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Public+Sans:wght@500;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
*{margin:0;box-sizing:border-box} body{width:1200px;height:630px;background:#B8174F;font-family:'Public Sans';color:#fff;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:40px;padding:64px 72px;background:radial-gradient(circle at 85% 20%,#E4407A,#B8174F 55%,#7A0E34)}
.mark{font:800 120px/0.9 'Big Shoulders Display';letter-spacing:-.01em}
.tag{font:700 22px/1 'Public Sans';letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin-top:14px}
h1{font:800 54px/1.02 'Big Shoulders Display';text-transform:uppercase;margin-top:44px}
.card{background:#111318;border-radius:28px;padding:30px 32px;box-shadow:0 30px 70px rgba(0,0,0,.35);display:grid;gap:18px}
.on{font:700 15px/1 'Public Sans';letter-spacing:.14em;text-transform:uppercase;color:#8D93A0;display:flex;gap:10px;align-items:center}
.on i{width:12px;height:12px;border-radius:50%;background:#FF3B30;display:inline-block}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.score b{font:800 92px/1 'Big Shoulders Display'} .score span{font:600 20px/1 'IBM Plex Mono';color:#FFD466;text-align:center}
.teams{display:flex;justify-content:space-between;font:700 20px/1 'Public Sans'}
.row{display:flex;align-items:center;gap:14px;background:#1C1F26;border-radius:16px;padding:14px 16px;font:500 19px/1.2 'Public Sans'}
.row b{display:block;font-weight:700} .row small{color:#8D93A0;font-size:16px} .row .p{margin-left:auto;font-weight:700}
.dot{width:40px;height:40px;border-radius:12px;background:#B8174F;display:grid;place-items:center;font-size:22px}
</style></head><body>
<div><div class="mark">agape</div><div class="tag">to your seat</div><h1>The game, and everything around it, from your seat.</h1></div>
<div class="card"><div class="on"><i></i>Live at Harbor Arena</div>
<div class="teams"><span>Kings</span><span>Comets</span></div>
<div class="score"><b>58</b><span>Q3 4:12</span><b style="text-align:right">54</b></div>
<div class="row"><div class="dot">🌭</div><div><b>Hot dog · on the way</b><small>At section 204 by 8:41 PM</small></div><span class="p">$8.00</span></div>
<div class="row"><div class="dot">★</div><div><b>Ayers ties it from deep</b><small>Collect the card · 37 left</small></div></div>
</div></body></html>
